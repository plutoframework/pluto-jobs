name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: jobs
          POSTGRES_DB: jobs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PLUTO_JOBS_TEST_DATABASE_URL: postgres://postgres:jobs@127.0.0.1:5432/jobs?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache-dependency-path: '**/go.sum'
      - uses: jdx/mise-action@v2
      - run: go work init . ./stores/postgres
      - run: ./scripts/check.sh
      - run: ./scripts/test.sh -race
      - run: ./scripts/fuzz.sh
      - run: python3 scripts/mutation-smoke.py
      - run: mise run generate && git diff --exit-code
      - name: Published module boundaries
        run: |
          GOWORK=off go test ./...
          cd stores/postgres
          GOWORK=off go test ./...
