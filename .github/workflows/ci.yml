name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: jobs
          POSTGRES_DB: jobs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PLUTO_JOBS_REQUIRE_DATABASE: "1"
      PLUTO_JOBS_TEST_DATABASE_URL: postgres://postgres:jobs@127.0.0.1:5432/jobs?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache-dependency-path: '**/go.sum'
      - uses: jdx/mise-action@v2
      - run: go work init . ./stores/postgres
      - run: ./scripts/check.sh
      - run: ./scripts/test.sh -race
      - run: ./scripts/fuzz.sh
      - name: Prepare SQL generator outside mutation timeouts
        run: GOWORK=off go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0 version
      - name: Require isolated SQL and mutation evidence
        run: ./scripts/postgres-check.sh
      - run: mise run generate && git diff --exit-code
      - name: Published module boundaries
        run: |
          GOWORK=off go test ./...
          cd stores/postgres
          GOWORK=off go test ./...
